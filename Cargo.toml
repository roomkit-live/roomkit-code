[workspace]
resolver = "3"
members = [".", "crates/roomkit-hooks"]

[package]
name = "roomkit-code"
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
description = "A coding assistant assembled from the RoomKit conversation framework"
license = "MIT"
repository = "https://github.com/roomkit-live/roomkit-code"
publish = false
include = ["build.rs", "src/**", "Cargo.toml", "Cargo.lock", "README.md", "USER_GUIDE.md", "LICENSE"]

[dependencies]
roomkit-hooks = { path = "crates/roomkit-hooks", version = "0.1.0" }
roomkit-auth = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-auth", rev = "f29f07e5c6885aa3dab22f4b9624104267b4e81c" }
# Keep the engine source identical to the CLI and tools adapters.
roomkit = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "4c51283a28aa961a2fc104788b50c5192c6b3924" }
# An event's plain text and the transcript's image references, which roomkit
# no longer re-exports.
roomkit-core = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "4c51283a28aa961a2fc104788b50c5192c6b3924" }
roomkit-mcp = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "4c51283a28aa961a2fc104788b50c5192c6b3924", features = ["http"] }
roomkit-ai = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "4c51283a28aa961a2fc104788b50c5192c6b3924" }
# The model providers, which are built on the same engine revision.
roomkit-providers-openai = { version = "0.1.0-alpha.1", git = "https://github.com/roomkit-live/roomkit-providers", rev = "3501b7ed41fd49b437d1f95ea68684efc60516fe" }
roomkit-providers-anthropic = { version = "0.1.0-alpha.1", git = "https://github.com/roomkit-live/roomkit-providers", rev = "3501b7ed41fd49b437d1f95ea68684efc60516fe" }
roomkit-sqlite = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "4c51283a28aa961a2fc104788b50c5192c6b3924" }
roomkit-tui-engine = { version = "0.3.1", git = "https://github.com/roomkit-live/roomkit-tui", rev = "f19f2de5c8f6c2ac6ef1d4e089f60714ccc2186e" }
roomkit-tui = { version = "0.3.1", git = "https://github.com/roomkit-live/roomkit-tui", rev = "f19f2de5c8f6c2ac6ef1d4e089f60714ccc2186e" }
roomkit-tools-code = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "5dfc5823969917dfe7224e15e097f01673620e0f" }
roomkit-tools-fs = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "5dfc5823969917dfe7224e15e097f01673620e0f" }
roomkit-tools-process = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "5dfc5823969917dfe7224e15e097f01673620e0f" }
roomkit-tools-roomkit = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "5dfc5823969917dfe7224e15e097f01673620e0f", features = ["plans", "docs"] }
roomkit-tools-plans = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "5dfc5823969917dfe7224e15e097f01673620e0f" }
# The application's own guide is served from local files only.
roomkit-tools-docs = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "5dfc5823969917dfe7224e15e097f01673620e0f", features = ["files"] }
roomkit-tools-core = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "5dfc5823969917dfe7224e15e097f01673620e0f" }
roomkit-tools-agents = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "5dfc5823969917dfe7224e15e097f01673620e0f" }
roomkit-tools-web = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "5dfc5823969917dfe7224e15e097f01673620e0f" }
roomkit-tools-search = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "5dfc5823969917dfe7224e15e097f01673620e0f", default-features = false, features = ["exa"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"
# PNG validation and encoding of private image attachments.
base64 = "0.23"
png = "0.18"
sha2 = "0.11"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# Pull-driven provider recovery; dropping the stream cancels its HTTP request.
async-stream = "0.3"
# rustls with the ring provider and the webpki roots, given to reqwest as a
# configuration (src/http_client.rs): 0.13 has no ring-backed feature.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustix = { version = "1", features = ["fs"] }
ignore = "0.4.34"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
