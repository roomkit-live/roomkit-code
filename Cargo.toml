[workspace]
resolver = "3"
members = [".", "crates/roomkit-hooks"]

[package]
name = "roomkit-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A coding assistant assembled from the RoomKit conversation framework"
license = "MIT"
repository = "https://github.com/roomkit-live/roomkit-code"
publish = false
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
roomkit-hooks = { path = "crates/roomkit-hooks", version = "0.1.0" }
roomkit-auth = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-auth", rev = "e995fe8f14d2c2d40f7330cb925ce7ad78126b4c" }
# Keep the engine source identical to the CLI and tools adapters.
roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "dd6ab1b2186518d159b0f38c830a4307834bf199" }
roomkit-mcp = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "dd6ab1b2186518d159b0f38c830a4307834bf199", features = ["http"] }
roomkit-ai = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "dd6ab1b2186518d159b0f38c830a4307834bf199" }
roomkit-openai = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "dd6ab1b2186518d159b0f38c830a4307834bf199" }
roomkit-sqlite = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "dd6ab1b2186518d159b0f38c830a4307834bf199" }
roomkit-cli-roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-cli", rev = "c9f9249ebec5eb1b9397805ccc1a62183abdaf1c" }
roomkit-tui = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-cli", rev = "c9f9249ebec5eb1b9397805ccc1a62183abdaf1c" }
roomkit-tools-code = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "73dbc6ec9aed07fed34cba306f6b69d0f6ff502b" }
roomkit-tools-fs = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "73dbc6ec9aed07fed34cba306f6b69d0f6ff502b" }
roomkit-tools-process = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "73dbc6ec9aed07fed34cba306f6b69d0f6ff502b" }
roomkit-tools-roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "73dbc6ec9aed07fed34cba306f6b69d0f6ff502b", features = ["plans"] }
roomkit-tools-plans = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "73dbc6ec9aed07fed34cba306f6b69d0f6ff502b" }
roomkit-tools-core = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "73dbc6ec9aed07fed34cba306f6b69d0f6ff502b" }
roomkit-tools-web = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "73dbc6ec9aed07fed34cba306f6b69d0f6ff502b" }
roomkit-tools-search = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "73dbc6ec9aed07fed34cba306f6b69d0f6ff502b", default-features = false, features = ["exa"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"
# PNG validation and encoding of private image attachments.
base64 = "0.22"
png = "0.18"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
