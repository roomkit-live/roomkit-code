[package]
name = "roomkit-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A coding assistant assembled from the RoomKit conversation framework"
license = "MIT"
repository = "https://github.com/roomkit-live/roomkit-code"
publish = false
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
# Keep the engine source identical to the CLI and tools adapters.
roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "c6de24a069a5d5c32d6ea57cd970a547bae63c25" }
roomkit-ai = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "c6de24a069a5d5c32d6ea57cd970a547bae63c25" }
roomkit-openai = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "c6de24a069a5d5c32d6ea57cd970a547bae63c25" }
roomkit-sqlite = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "c6de24a069a5d5c32d6ea57cd970a547bae63c25" }
roomkit-cli-roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-cli", rev = "39c0c748837626c0c50da7a415b42f33a9517766" }
roomkit-tui = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-cli", rev = "39c0c748837626c0c50da7a415b42f33a9517766" }
roomkit-tools-code = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "a9d092e87ab79a7573b0f8ab236117cec703bee0" }
roomkit-tools-fs = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "a9d092e87ab79a7573b0f8ab236117cec703bee0" }
roomkit-tools-process = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "a9d092e87ab79a7573b0f8ab236117cec703bee0" }
roomkit-tools-roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "a9d092e87ab79a7573b0f8ab236117cec703bee0" }
roomkit-tools-web = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "a9d092e87ab79a7573b0f8ab236117cec703bee0" }
roomkit-tools-search = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "a9d092e87ab79a7573b0f8ab236117cec703bee0", default-features = false, features = ["exa"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
