[workspace]
resolver = "3"
members = [".", "crates/roomkit-hooks"]

[package]
name = "roomkit-code"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
description = "A coding assistant assembled from the RoomKit conversation framework"
license = "MIT"
repository = "https://github.com/roomkit-live/roomkit-code"
publish = false
include = ["build.rs", "src/**", "Cargo.toml", "Cargo.lock", "README.md", "USER_GUIDE.md", "LICENSE"]

[dependencies]
roomkit-hooks = { path = "crates/roomkit-hooks", version = "0.1.0" }
roomkit-auth = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-auth", rev = "f29f07e5c6885aa3dab22f4b9624104267b4e81c" }
# Keep the engine source identical to the CLI and tools adapters.
roomkit = { version = "0.3.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "e6f92c6dba1cb158ff2cc8d734038a1100402ceb" }
# An event's plain text and the transcript's image references, which roomkit
# no longer re-exports.
roomkit-core = { version = "0.3.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "e6f92c6dba1cb158ff2cc8d734038a1100402ceb" }
roomkit-mcp = { version = "0.3.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "e6f92c6dba1cb158ff2cc8d734038a1100402ceb", features = ["http"] }
roomkit-ai = { version = "0.3.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "e6f92c6dba1cb158ff2cc8d734038a1100402ceb" }
# The model providers, which are built on the same engine revision.
roomkit-providers-openai = { version = "0.1.0-alpha.1", git = "https://github.com/roomkit-live/roomkit-providers", rev = "708ff3f3f45488036b81f7b8af51755f30822667" }
roomkit-providers-llamacpp = { version = "0.1.0-alpha.1", git = "https://github.com/roomkit-live/roomkit-providers", rev = "708ff3f3f45488036b81f7b8af51755f30822667" }
roomkit-providers-anthropic = { version = "0.1.0-alpha.1", git = "https://github.com/roomkit-live/roomkit-providers", rev = "708ff3f3f45488036b81f7b8af51755f30822667" }
roomkit-providers-redis = { version = "0.1.0-alpha.1", git = "https://github.com/roomkit-live/roomkit-providers", rev = "708ff3f3f45488036b81f7b8af51755f30822667" }
roomkit-providers-sqlite = { version = "0.1.0-alpha.1", git = "https://github.com/roomkit-live/roomkit-providers", rev = "708ff3f3f45488036b81f7b8af51755f30822667" }
roomkit-tui-engine = { version = "0.3.1", git = "https://github.com/roomkit-live/roomkit-tui", rev = "8f6ba8cf555ff159d1c967b04b1cc266c7163d8b" }
roomkit-tui = { version = "0.3.1", git = "https://github.com/roomkit-live/roomkit-tui", rev = "8f6ba8cf555ff159d1c967b04b1cc266c7163d8b" }
roomkit-tools-memory = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60" }
roomkit-tools-code = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60" }
roomkit-tools-fs = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60" }
roomkit-tools-process = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60" }
roomkit-tools-roomkit = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60", features = ["plans", "docs", "memory"] }
roomkit-tools-plans = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60" }
# The application's own guide is served from local files only.
roomkit-tools-docs = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60", features = ["files"] }
roomkit-tools-core = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60" }
roomkit-tools-agents = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60" }
roomkit-tools-web = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60" }
roomkit-tools-search = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "171ba557fff782a7b4e74b9e1dd2ce7f226bef60", default-features = false, features = ["exa"] }
redis = { version = "1.8.2", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"
# PNG validation and encoding of private image attachments.
base64 = "0.23"
png = "0.18"
sha2 = "0.11"
# The session group's key seals its messages; the version RoomKit's crates use.
hmac = "0.13"
# Verifies a release's signature before an update installs it; it has no
# dependency of its own.
minisign-verify = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# Pull-driven provider recovery; dropping the stream cancels its HTTP request.
async-stream = "0.3"
# rustls with the ring provider and the webpki roots, given to reqwest as a
# configuration (src/http_client.rs): 0.13 has no ring-backed feature.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustix = { version = "1", features = ["fs", "system", "process"] }
ignore = "0.4.34"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
