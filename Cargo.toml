[package]
name = "roomkit-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A coding assistant assembled from the RoomKit conversation framework"
license = "MIT"
repository = "https://github.com/roomkit-live/roomkit-code"
publish = false
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
roomkit-auth = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-auth", rev = "e995fe8f14d2c2d40f7330cb925ce7ad78126b4c" }
# Keep the engine source identical to the CLI and tools adapters.
roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "6d6adfafb3dc89420ed90c97b4ed30b4a58e4650" }
roomkit-ai = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "6d6adfafb3dc89420ed90c97b4ed30b4a58e4650" }
roomkit-openai = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "6d6adfafb3dc89420ed90c97b4ed30b4a58e4650" }
roomkit-sqlite = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "6d6adfafb3dc89420ed90c97b4ed30b4a58e4650" }
roomkit-cli-roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-cli", rev = "bd930c29efaaa62c347e3235d0d8a28b22125401" }
roomkit-tui = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-cli", rev = "bd930c29efaaa62c347e3235d0d8a28b22125401" }
roomkit-tools-code = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "aa293c6eb1df62554e4d1728139b5936b09940e7" }
roomkit-tools-fs = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "aa293c6eb1df62554e4d1728139b5936b09940e7" }
roomkit-tools-process = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "aa293c6eb1df62554e4d1728139b5936b09940e7" }
roomkit-tools-roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "aa293c6eb1df62554e4d1728139b5936b09940e7" }
roomkit-tools-web = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "aa293c6eb1df62554e4d1728139b5936b09940e7" }
roomkit-tools-search = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-tools", rev = "aa293c6eb1df62554e4d1728139b5936b09940e7", default-features = false, features = ["exa"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
