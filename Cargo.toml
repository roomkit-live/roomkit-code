[workspace]
resolver = "3"
members = [".", "crates/roomkit-hooks"]

[package]
name = "roomkit-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A coding assistant assembled from the RoomKit conversation framework"
license = "MIT"
repository = "https://github.com/roomkit-live/roomkit-code"
publish = false
include = ["build.rs", "src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
roomkit-hooks = { path = "crates/roomkit-hooks", version = "0.1.0" }
roomkit-auth = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-auth", rev = "3bf770c886dc64e14b4071fa6a6f28be97e874ce" }
# Keep the engine source identical to the CLI and tools adapters.
roomkit = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "ee5d72409d8bf44fdc94699c735639536a823a29" }
# An event's plain text and the transcript's image references, which roomkit
# no longer re-exports.
roomkit-core = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "ee5d72409d8bf44fdc94699c735639536a823a29" }
roomkit-mcp = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "ee5d72409d8bf44fdc94699c735639536a823a29", features = ["http"] }
roomkit-ai = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "ee5d72409d8bf44fdc94699c735639536a823a29" }
roomkit-openai = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "ee5d72409d8bf44fdc94699c735639536a823a29" }
roomkit-sqlite = { version = "0.1.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "ee5d72409d8bf44fdc94699c735639536a823a29" }
roomkit-tui-engine = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tui", rev = "cf0840e120b0bb030705b3e3d5f1358be68658c6" }
roomkit-tui = { version = "0.2.0", git = "https://github.com/roomkit-live/roomkit-tui", rev = "cf0840e120b0bb030705b3e3d5f1358be68658c6" }
roomkit-tools-code = { version = "0.1.0-alpha.16", git = "https://github.com/roomkit-live/roomkit-tools", rev = "c7be169c0841d4138ff4672109797a5a0782e8b7" }
roomkit-tools-fs = { version = "0.1.0-alpha.16", git = "https://github.com/roomkit-live/roomkit-tools", rev = "c7be169c0841d4138ff4672109797a5a0782e8b7" }
roomkit-tools-process = { version = "0.1.0-alpha.16", git = "https://github.com/roomkit-live/roomkit-tools", rev = "c7be169c0841d4138ff4672109797a5a0782e8b7" }
roomkit-tools-roomkit = { version = "0.1.0-alpha.16", git = "https://github.com/roomkit-live/roomkit-tools", rev = "c7be169c0841d4138ff4672109797a5a0782e8b7", features = ["plans", "docs"] }
roomkit-tools-plans = { version = "0.1.0-alpha.16", git = "https://github.com/roomkit-live/roomkit-tools", rev = "c7be169c0841d4138ff4672109797a5a0782e8b7" }
# The application's own guide is served from local files only.
roomkit-tools-docs = { version = "0.1.0-alpha.16", git = "https://github.com/roomkit-live/roomkit-tools", rev = "c7be169c0841d4138ff4672109797a5a0782e8b7", features = ["files"] }
roomkit-tools-core = { version = "0.1.0-alpha.16", git = "https://github.com/roomkit-live/roomkit-tools", rev = "c7be169c0841d4138ff4672109797a5a0782e8b7" }
roomkit-tools-web = { version = "0.1.0-alpha.16", git = "https://github.com/roomkit-live/roomkit-tools", rev = "c7be169c0841d4138ff4672109797a5a0782e8b7" }
roomkit-tools-search = { version = "0.1.0-alpha.16", git = "https://github.com/roomkit-live/roomkit-tools", rev = "c7be169c0841d4138ff4672109797a5a0782e8b7", default-features = false, features = ["exa"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"
# PNG validation and encoding of private image attachments.
base64 = "0.23"
png = "0.18"
sha2 = "0.11"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# rustls with the ring provider and the webpki roots, given to reqwest as a
# configuration (src/http_client.rs): 0.13 has no ring-backed feature.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustix = { version = "1", features = ["fs"] }
ignore = "0.4.34"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
