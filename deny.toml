[advisories]
version = 2
ignore = [
    # Inherited from the TUI: Syntect loads only its embedded syntax grammars.
    # Revisit when the upstream highlighter replaces bincode 1.3.3.
    { id = "RUSTSEC-2025-0141", reason = "Syntect only loads trusted bundled grammars; no external bincode input" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "ISC", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/roomkit-live/roomkit-rs", "https://github.com/roomkit-live/roomkit-cli", "https://github.com/roomkit-live/roomkit-tools", "https://github.com/roomkit-live/roomkit-auth"]

# arboard's optional Windows clipboard backend, inherited from roomkit-tui.
[[licenses.exceptions]]
name = "clipboard-win"
allow = ["BSL-1.0"]
[[licenses.exceptions]]
name = "error-code"
allow = ["BSL-1.0"]
