name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure dependency access when a token is supplied
        env:
          ROOMKIT_DEPS_READ_CI: ${{ secrets.ROOMKIT_DEPS_READ_CI }}
        run: bash scripts/ci-dependency-access.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: make check
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.94.0 --profile minimal
      - run: make msrv
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/roomkit-code-dependency-access/credentials"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        with:
          credentials: ${{ secrets.ROOMKIT_DEPS_READ_CI != '' && format('https://x-access-token:{0}@github.com', secrets.ROOMKIT_DEPS_READ_CI) || '' }}
