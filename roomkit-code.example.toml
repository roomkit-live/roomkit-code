# Explicitly select with: roomkit-code --config roomkit-code.local.toml
# Keep personal configuration in an ignored *.local.toml file.
[provider]
base_url = "http://localhost:8000/v1"
model = "your-model"
# API keys are read only from ROOMKIT_API_KEY, never from this file.

[ui]
theme = "dark" # dark, light, terminal
color = "auto" # auto, always, never
animations = true
native_selection = false
markdown = true # false keeps the model's literal Markdown syntax
message_gap = 1 # blank lines between transcript items, 0 to 3
tool_preview_lines = 4 # maximum collapsed tool detail rows, 1 to 8
input_min_lines = 2 # editable rows in the filled composer, 1 to 5
input_padding = 1 # filled rows above/below the draft, 0 to 2
name = "RoomKit Code"
# logo = ["RK", "CODE"]
# logo = [] # hide the logo
