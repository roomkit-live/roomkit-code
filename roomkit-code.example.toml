# Explicitly select with: roomkit-code --config roomkit-code.local.toml
# Keep personal configuration in an ignored *.local.toml file.
[provider]
base_url = "http://localhost:8000/v1"
model = "your-model"
timeout_seconds = 600 # longest wait between two reads of a model answer
# context_window = 32768 # actual server capacity; omitted means unknown
# max_output_tokens = 4096 # most tokens one reply may write; omitted sends no limit
# API keys are read only from ROOMKIT_API_KEY, never from this file.

# The model's list price, which shows the conversation's cost. The kit already
# prices OpenAI's models; this prices this server's model, per million tokens.
# [provider.pricing]
# input_per_million = 0.50
# output_per_million = 1.50
# cache_read_per_million = 0.05 # tokens read from the prompt cache
# cache_write_per_million = 0.60 # tokens written to it, where billed apart
# currency = "USD"
# verified = "2026-11-06" # the day the rates were read

[agent]
require_tool_intent = true # false makes the public description optional in model-facing tool schemas

[permissions]
mode = "ask" # ask, plan, yolo; --mode overrides this explicit configuration

[ui]
welcome = true # centered composer for empty conversations
welcome_width = 88 # columns, clamped to 48–100
bottom_margin = 1 # blank rows below the UI, 0 to 3
# welcome_logo = ["Your terminal symbol"]
# welcome_wordmark = ["Your application"]
sidebar = true # F7 toggles locally; narrow terminals hide it automatically
sidebar_width = 34 # display columns, clamped to 28–48
theme = "dark" # dark, light, terminal
color = "auto" # auto, always, never
animations = true
native_selection = false
terminal_status = true # OSC 7501 status; --no-terminal-status disables it
markdown = true # false keeps the model's literal Markdown syntax
message_gap = 1 # blank lines between transcript items, 0 to 3
highlight_own_messages = true # input-colored sent messages, without an author heading
tool_preview_lines = 4 # maximum collapsed tool detail rows, 1 to 8
input_min_lines = 1 # editable rows in the filled composer, 1 to 5
input_padding = 1 # filled rows above/below the draft, 0 to 2
input_placeholder = "Ask about this project…" # empty string hides the hint
input_prompt = "›" # empty string hides the marker
name = "RoomKit Code"
# logo = ["RK", "CODE"]
# logo = [] # hide the logo

[shell]
# Host variables shell commands receive beyond the built-in development list;
# NAME_* passes every variable with that prefix except names that read as
# credentials (KEY, TOKEN, SECRET…). The model can read them.
# inherit_env = ["LD_LIBRARY_PATH", "PKG_CONFIG_PATH", "NIX_*"]

[integrations]
herdr = true # auto-detect Herdr TUI; --no-herdr disables this adapter

# Managed installations check GitHub at most once per day. No automatic install.
[updates]
check = true
